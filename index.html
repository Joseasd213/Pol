<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <style type="text/tailwindcss">
      :root{
        --background: blue;
        --foreground: #001100;
      }

      .dark{
        --background: #001100;
        --foreground: #ffeeff;
      }
      @theme{
        --color-background: var (--background);
        --color-foreground: var (--foreground);
      }
      
    </style>
</head>
  <body class="bg-background text-foreground"> 
      <div class="flex justify-between border-b p-2">
        <h1 class="text-[30px] text-[#0099ff] font-[700] underline">
          Hello world!
        </h1>

      <button onclick="cambiaTema()" class="cursor-pointer bg-orange-300 px-4 rounded-x1 hover:bg-orange-500 rounded-xs">Cambia boton</button>
        <script>
          function cambiaTema(){
            document.documentElement.classlist.toggle("dark")
          }
        </script>
    </div>
  </body>
</html>
